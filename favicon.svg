<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jorge Gonzalez - Web Development &amp; Automations">
  <!--
    Favicon alineado al branding claro (regla 60/30/10):
    - Superficie: slate-900 (#0F172A), el mismo tono del monograma del navbar.
    - Monograma: "JG" en blanco, peso extrabold, igual que el logo del header.
    - Acento 10%: punto brand-500 (#10B981) que replica el ".DEV" del wordmark.
    Sin degradados neón: color plano para máxima legibilidad a 16px.
  -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- "JG" + punto centrados como una sola unidad (mismas proporciones que los PNG) -->
  <text x="6" y="43.5"
        font-family="'Plus Jakarta Sans','Segoe UI',system-ui,Arial,sans-serif"
        font-size="33" font-weight="800" letter-spacing="-1"
        text-anchor="start" fill="#FFFFFF">JG</text>
  <circle cx="49.5" cy="40" r="3.5" fill="#10B981"/>
</svg>
